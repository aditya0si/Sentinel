[project]
name = "sentinel"
version = "0.1.0"
description = "Guardrails & quality-gate framework for agentic AI systems"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "langchain>=0.2.0",
    "langchain-chroma>=0.1.0",
    "chromadb>=0.5.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "opentelemetry-instrumentation-langchain>=0.33.0",
    "opentelemetry-instrumentation-fastapi>=0.44.0",
    "pyyaml>=6.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.0",
    "ruff>=0.3.0",
    "black>=24.0",
]
groq = [
    "langchain-groq>=0.1.0",
]
gemini = [
    "langchain-google-genai>=1.0.0",
]
openai-provider = [
    "langchain-openai>=0.1.0",
    "openai>=1.0.0",
]
ollama = [
    "langchain-ollama>=0.1.0",
]
providers = [
    "langchain-groq>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "langchain-openai>=0.1.0",
    "openai>=1.0.0",
    "langchain-ollama>=0.1.0",
]
hallucination = [
    "sentence-transformers>=2.7.0",
]
pii = [
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "spacy>=3.7.0",
]
toxicity = [
    "transformers>=4.40.0",
    "torch>=2.2.0",
]
all-optional = [
    "sentence-transformers>=2.7.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "spacy>=3.7.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "langchain-groq>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "langchain-openai>=0.1.0",
    "openai>=1.0.0",
    "langchain-ollama>=0.1.0",
]

[tool.setuptools.packages.find]
include = ["guardrails*", "observability*", "monitoring*", "api*", "demo*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
